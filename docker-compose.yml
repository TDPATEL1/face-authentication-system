services:

  face-auth-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: face-auth-api

    env_file:
      - .env.docker

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8000"

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024m
        reservations:
          cpus: "1.0"
          memory: 512m

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: face-auth-nginx

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      face-auth-api:
        condition: service_healthy

    restart: unless-stopped 