services:
  face-auth-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: face-auth-api

    ports:
      - "8000:8000"

    env_file:
      - .env
      - .env.docker

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s